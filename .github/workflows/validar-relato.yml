name: Validar Relato (kit)

# Workflow reutilizável. Chamado pelos templates de atividade via:
#   jobs:
#     validar-relato:
#       uses: profBruno-UFC-Qx/kit-projeto-final/.github/workflows/validar-relato.yml@main
#       with:
#         project_number: 7
#       secrets: inherit
#
# Só valida as seções GENÉRICAS de RELATO.md (antes do marcador
# "<!-- kit:fim-secoes-genericas -->"). O que vem depois do marcador é
# específico de cada atividade e não é verificado aqui.
#
# Precisa ser chamado com "on: pull_request" no template (não "push") —
# o job adicionar-ao-board só tem contexto de PR (github.event.pull_request)
# nesse tipo de evento.

on:
  workflow_call:
    inputs:
      project_number:
        description: "Número do GitHub Project (v2) onde a entrega deve aparecer quando o relato for validado. Omitido = não adiciona a nenhum board."
        required: false
        type: number
    secrets:
      ADD_TO_PROJECT_PAT:
        description: "PAT com escopo 'project' (write), usado só pelo job adicionar-ao-board."
        required: false

jobs:
  validar-relato:
    name: validar-relato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar RELATO.md
        shell: bash
        run: |
          set -uo pipefail

          RELATO="RELATO.md"
          MARCADOR="<!-- kit:fim-secoes-genericas -->"

          if [ ! -f "$RELATO" ]; then
            echo "❌ Não encontrei $RELATO na raiz do repositório."
            exit 1
          fi

          GENERICO=$(awk -v marcador="$MARCADOR" 'index($0, marcador) { exit } { print }' "$RELATO")

          falhou=0

          placeholder() {
            if printf '%s' "$GENERICO" | grep -qF "$1"; then
              echo "❌ Campo ainda não preenchido: \"$1\""
              falhou=1
            fi
          }

          secao_obrigatoria() {
            if ! printf '%s' "$GENERICO" | grep -qF "$1"; then
              echo "❌ Seção obrigatória removida ou renomeada: \"$1\""
              falhou=1
            fi
          }

          placeholder "_Seu nome completo._"
          placeholder "_Seu número de matrícula._"
          placeholder "_Ex: \"Sozinho\", \"Sozinho, mas discuti dúvidas com Fulano\"._"
          placeholder "_Quais foram as principais dificuldades? O que você aprendeu com essa atividade?_"
          placeholder "_1 = Muito fácil, 5 = Muito difícil._"
          placeholder "_1 = Muito chato, 5 = Muito interessante._"
          placeholder "_Tempo total, incluindo revisão de material, vídeos e programação (em horas)._"
          placeholder "Você usou alguma ferramenta de IA (ex: ChatGPT, Claude, GitHub Copilot) para resolver essa"

          secao_obrigatoria "## Nome"
          secao_obrigatoria "## Matrícula"
          secao_obrigatoria "## Com quem você fez essa atividade?"
          secao_obrigatoria "## Dificuldades encontradas e aprendizado"
          secao_obrigatoria "## Grau de dificuldade (1 a 5)"
          secao_obrigatoria "## O quão interessante foi o problema proposto (1 a 5)"
          secao_obrigatoria "## Tempo gasto"
          secao_obrigatoria "Uso de ferramentas de Inteligência Artificial"

          if [ "$falhou" -ne 0 ]; then
            echo ""
            echo "O relato ainda não está completo. Preencha os itens acima e faça commit."
            exit 1
          fi

          echo "✅ Relato passou na validação mínima."

  adicionar-ao-board:
    name: adicionar-ao-board
    needs: validar-relato
    if: inputs.project_number != null && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar PR ao Project
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️  Secret ADD_TO_PROJECT_PAT não disponível para este repositório — pulando."
            exit 0
          fi
          gh project item-add "${{ inputs.project_number }}" \
            --owner profBruno-UFC-Qx \
            --url "${{ github.event.pull_request.html_url }}"
